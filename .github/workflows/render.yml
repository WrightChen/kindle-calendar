name: Render calendar

on:
  schedule:
    - cron: "5 16 * * *"   # 00:05 Asia/Shanghai, new day
    - cron: "0 * * * *"    # hourly refresh (footer time, safety net)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # commits schedule.json back to the repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch Noto Sans CJK SC
        uses: actions/cache@v4
        id: fontcache
        with:
          path: fonts
          key: noto-cjk-sc-v1
      - if: steps.fontcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/NotoSansCJKsc-Regular.otf https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          curl -fsSL -o fonts/NotoSansCJKsc-Bold.otf    https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf
      - name: Extend the no-repeat schedule (today .. today+13)
        run: python schedule.py --days 14
      - run: python render_qa.py --out site/calendar.png && python render.py --out site/month.png
      - name: Pre-render the next 14 days as site/d/YYYY-MM-DD.png
        # GitHub's scheduler runs late (often 1-4 h after midnight), so the Kindle asks for
        # its own date's file instead of trusting calendar.png to be fresh.
        run: |
          mkdir -p site/d
          for i in $(seq 0 13); do
            d=$(TZ=Asia/Shanghai date -d "+$i day" +%F)
            python render_qa.py --out "site/d/$d.png" --date "$d"
          done
          ls site/d
      - run: cp site/calendar.png site/index.png && printf '<img src="calendar.png">' > site/index.html
      - name: Commit schedule.json (also keeps the repo active so GitHub never disables the cron)
        run: |
          if ! git diff --quiet -- schedule.json; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add schedule.json
            git commit -m "schedule: $(TZ=Asia/Shanghai date +%F)"
            git pull --rebase -q origin main && git push -q origin HEAD:main || echo "push failed; next run will retry"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
